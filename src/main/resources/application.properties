# Datasource
quarkus.datasource.db-kind=postgresql

# Dev : base locale docker-compose (docker compose up -d)
%dev.quarkus.datasource.username=retrocession
%dev.quarkus.datasource.password=retrocession
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5435/retrocession

# Test : pas d'URL -> Quarkus Dev Services démarre un Postgres jetable

# Prod : fournie par l'environnement
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# Flyway : migrations dans src/main/resources/db/migration
quarkus.flyway.migrate-at-start=true
